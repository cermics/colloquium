# Colloquium du CERMICS, du plus récent au plus ancien.
#
# Champs d'une séance :
#   date      AAAA/MM/JJ (obligatoire)
#   hour      ex. 14h, ou "void" pour ne pas afficher d'heure
#   AU, UN    orateur, affiliation
#   TI        titre (entre guillemets)
#   slides    lien (URL complète ou chemin local comme assets/colloquium/x.pdf)
#   abstract  lien vers un PDF de résumé
#   contents  résumé affiché dans un bloc dépliable (Markdown accepté)
#   TIb, slidesb, abstractb   second exposé du même orateur
#   note      mention affichée en italique (co-organisation, etc.)
#   room      salle (par défaut : Salle de séminaire du CERMICS)
#   next      true pour la séance à venir : elle s'affiche en « Next session »
#             et est retirée des séances passées. Après la séance, supprimer
#             la ligne `next: true`.
#   sem: scommun + PROG   séance commune à plusieurs exposés
#
# Modèle pour la prochaine séance (décommenter et remplir) :
# - date: 2027/01/14
#   hour: 14h
#   AU: Prénom Nom
#   UN: Institution
#   TI: "Titre"
#   contents: >-
#     Résumé.
#   next: true

